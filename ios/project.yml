name: Momentum
options:
  bundleIdPrefix: com.momentum
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Momentum/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  Momentum:
    type: application
    platform: iOS
    sources:
      - path: Momentum
        type: group
    entitlements:
      path: Momentum/Momentum.entitlements
    info:
      path: Momentum/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app
        INFOPLIST_FILE: Momentum/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies: []
    preBuildScripts:
      - name: "Copy ML Models"
        script: |
          if [ -d "$SRCROOT/Momentum/MLModels" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp -R "$SRCROOT/Momentum/MLModels/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          fi
